      // CES_V221_CACHE_MIGRATION: force fresh shell/config/permissions after a release.

          ['ces_role_permissions_v21','ces_system_settings_v21','CES_CORE_DATA_CACHE_V20'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(ignore){} });

          localStorage.setItem('CES_LAST_BUILD_HASH_V222', window.CES_BUILD_HASH);
        }
      } catch(ignore3) {}

      window.CES_asset = function(url) {
        if (!url || /^(https?:)?\/\//i.test(url) || url.indexOf('data:') === 0) return url;
        var sep = url.indexOf('?') >= 0 ? '&' : '?';
        return url + sep + 'v=' + encodeURIComponent(window.CES_BUILD_HASH);
      };









      // On-demand library loader for rarely-used heavy libs




      window.CES_loadLib = function(url) {




        return new Promise(function(resolve, reject) {




          if (document.querySelector('script[src="' + url + '"]')) { resolve(); return; }




          var s = document.createElement('script');




          s.src = url; s.onload = resolve; s.onerror = reject;




          document.head.appendChild(s);




        });




      };




      window.CES_LIBS = {




        tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js',

      // Boot watchdog: never leave the app stuck on the splash screen.
      window.CES_BOOT_WATCHDOG = setTimeout(function() {
        if (typeof window.CES_hideSplash === 'function') window.CES_hideSplash();
        var box = document.getElementById('ces-boot-error');
        if (box) {
          box.classList.remove('hidden');
          box.textContent = 'CES Hub loaded slowly. Please refresh once if a page is incomplete.';

      window.CES_hideSplash = function() {




        var splash = document.getElementById('ces-splash');




        if (splash) { splash.style.opacity='0'; splash.style.transition='opacity 0.3s'; setTimeout(function(){splash.style.display='none';},300); }

      function cesPrepareBootItemV19(item) {
        var copy={};Object.keys(item||{}).forEach(function(key){copy[key]=item[key];});
        copy.optional=copy.optional===true||copy.required===false;copy.url=window.CES_asset(copy.url);return copy;
      }

      var deferredPromiseV19=null;
      window.CES_loadDeferredModules=function(){
        if(deferredPromiseV19)return deferredPromiseV19;
        deferredPromiseV19=CESBoot.loadHtml(window.CES_BOOT_MANIFEST.deferredHtml.map(cesPrepareBootItemV19))
          .then(function(){return CESBoot.loadScripts(window.CES_BOOT_MANIFEST.deferredScripts.map(cesPrepareBootItemV19));})
          .then(function(result){try{window.dispatchEvent(new CustomEvent('ces:deferred-ready',{detail:CESBoot.getReport()}));}catch(ignore){}return result;});
        return deferredPromiseV19;
      };

      CESBoot.loadHtml(window.CES_BOOT_MANIFEST.coreHtml.map(cesPrepareBootItemV19))
        .then(function(){return CESBoot.loadScripts(window.CES_BOOT_MANIFEST.coreScripts.map(cesPrepareBootItemV19));})
        .then(function(){
          if(window.CES_BOOT_WATCHDOG)clearTimeout(window.CES_BOOT_WATCHDOG);CES_hideSplash();
          try{window.dispatchEvent(new CustomEvent('ces:app-ready',{detail:CESBoot.getReport()}));}catch(ignore){}
          var deferredStartedV205=false;var schedule=function(){if(deferredStartedV205)return;deferredStartedV205=true;window.CES_loadDeferredModules().catch(function(error){console.warn('[CES deferred modules]',error);});};
          window.addEventListener('ces:home-ready',schedule,{once:true});
          setTimeout(function(){if('requestIdleCallback' in window)requestIdleCallback(schedule,{timeout:700});else schedule();},2600);
        })
        .catch(function(err){
          if(window.CES_BOOT_WATCHDOG)clearTimeout(window.CES_BOOT_WATCHDOG);console.error('[CES Hub boot failed]',err);CES_hideSplash();
          var box=document.getElementById('ces-boot-error');if(box){box.classList.remove('hidden');box.textContent='CES Hub boot error: '+(err&&err.message?err.message:err);}
        });
