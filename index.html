      function cesDeferredItemByUrl(url){
        var list=window.CES_BOOT_MANIFEST.deferredScripts||[];
        for(var i=0;i<list.length;i++)if(list[i].url===url)return cesPrepareBootItem(list[i]);
        return cesPrepareBootItem({url:url,optional:true});
      }
      function cesDeferredViewItem(tab){
        var id='view-'+String(tab||'');
        var list=window.CES_BOOT_MANIFEST.deferredHtml||[];
        for(var i=0;i<list.length;i++)if(list[i].viewId===id)return cesPrepareBootItem(list[i]);
        return null;
      }
      function cesEnsureDeferredView(tab){
        tab=String(tab||'').trim();if(!tab||tab==='portal'||document.getElementById('view-'+tab))return Promise.resolve(true);
        if(cesDeferredViewPromises[tab])return cesDeferredViewPromises[tab];
        var item=cesDeferredViewItem(tab);if(!item)return Promise.resolve(false);
        cesDeferredViewPromises[tab]=CESBoot.loadHtml([item]).then(function(){return !!document.getElementById('view-'+tab);}).catch(function(error){delete cesDeferredViewPromises[tab];throw error;});
        return cesDeferredViewPromises[tab];
      }
      window.CES_ensureDeferredView=cesEnsureDeferredView;
      function cesPreloadDeferredViews(){
        if(cesDeferredViewWarmPromise)return cesDeferredViewWarmPromise;
        var missing=(window.CES_BOOT_MANIFEST.deferredHtml||[]).filter(function(item){return !document.getElementById(item.viewId);}).map(cesPrepareBootItem);
        if(!missing.length)return Promise.resolve([]);
        cesDeferredViewWarmPromise=CESBoot.loadHtml(missing).catch(function(error){console.warn('[CES deferred HTML warm]',error);return[];});
        return cesDeferredViewWarmPromise;
      }
      window.CES_preloadDeferredViews=cesPreloadDeferredViews;

      function cesPrepareDeferredCode(item){
        var key=String(item.url||'');
        if(!cesDeferredCodePromises[key])cesDeferredCodePromises[key]=CESBoot.getText(item.url);
        return cesDeferredCodePromises[key];
      }
      function cesExecuteDeferredScript(item){
        var clean=String(item.url||'').replace(/([?&])v=[^&]*/g,'$1').replace(/[?&]$/,'');
        if(cesDeferredLoadedScripts[clean]||document.querySelector('script[data-ces-source="'+clean+'"]')){
          cesDeferredLoadedScripts[clean]=true;return Promise.resolve(true);
        }
        if(cesDeferredScriptPromises[clean])return cesDeferredScriptPromises[clean];
        cesDeferredScriptPromises[clean]=cesPrepareDeferredCode(item).then(function(code){
          if(cesDeferredLoadedScripts[clean])return true;
          var script=document.createElement('script');script.setAttribute('data-ces-source',clean);script.text=code+'\n//# sourceURL='+clean;document.head.appendChild(script);cesDeferredLoadedScripts[clean]=true;
          try{window.dispatchEvent(new CustomEvent('ces:deferred-script-loaded',{detail:{url:clean}}));}catch(ignore){}
          return new Promise(function(resolve){if(typeof requestAnimationFrame==='function')requestAnimationFrame(function(){setTimeout(function(){resolve(true);},0);});else setTimeout(function(){resolve(true);},0);});
        }).catch(function(error){console.warn('[CES deferred script]',clean,error);if(item.optional)return false;throw error;});
        return cesDeferredScriptPromises[clean];
      }
      function cesDeferredScriptsForTab(tab){
        var urls=(CES_DEFERRED_TAB_SCRIPTS[tab]||[]).slice();
        var seen=Object.create(null);return urls.filter(function(url){if(seen[url])return false;seen[url]=true;return true;});

      window.CES_prepareDeferredTab=function(tab){

        return Promise.all([cesEnsureDeferredView(tab)].concat(codePromises)).then(function(){return true;}).catch(function(error){console.warn('[CES tab prepare]',tab,error);return false;});

      var cesDeferredSharedTailPromise=null;
      function cesLoadDeferredSharedTailLater_(){
        if(cesDeferredSharedTailPromise)return cesDeferredSharedTailPromise;
        var items=CES_DEFERRED_SHARED_TAIL.map(cesDeferredItemByUrl);
        items.forEach(cesPrepareDeferredCode);
        cesDeferredSharedTailPromise=new Promise(function(resolve){
          var run=function(){var chain=Promise.resolve();items.forEach(function(item){chain=chain.then(function(){return cesExecuteDeferredScript(item);});});chain.then(resolve,function(error){console.warn('[CES shared tail]',error);resolve(false);});};
          if(window.CES_TASK_PRIORITY&&typeof window.CES_TASK_PRIORITY.whenIdle==='function')window.CES_TASK_PRIORITY.whenIdle(run,{timeout:7000});else setTimeout(run,1800);
        });
        return cesDeferredSharedTailPromise;
      }
      window.CES_isDeferredTabReady=function(tab){
        if(!tab||tab==='portal')return true;
        if(!document.getElementById('view-'+tab))return false;
        return cesDeferredScriptsForTab(tab).every(function(url){return !!cesDeferredLoadedScripts[url]||!!document.querySelector('script[data-ces-source="'+url+'"]');});
      };

      window.CES_loadDeferredModules=function(focusTab){
        if(!focusTab)return cesPreloadDeferredViews();
        focusTab=String(focusTab||'').trim();
        if(window.CES_TASK_PRIORITY&&typeof window.CES_TASK_PRIORITY.setActiveTab==='function')window.CES_TASK_PRIORITY.setActiveTab(focusTab);
        if(window.CES_isDeferredTabReady(focusTab))return Promise.resolve(true);
        if(cesDeferredGroupPromises[focusTab])return cesDeferredGroupPromises[focusTab];
        var viewItem=cesDeferredViewItem(focusTab);
        var ensureView=cesEnsureDeferredView(focusTab);
        // Do not warm unrelated views while the user is waiting for this page.
        // The selected view + selected business scripts get the network/main-thread first.
        var items=cesDeferredScriptsForTab(focusTab).map(cesDeferredItemByUrl);
        // Fetch the selected tab's code in parallel, then execute only that
        // ordered subset.  This keeps legacy override order while avoiding the
        // previous 30+ module burst and its API side effects.
        items.forEach(cesPrepareDeferredCode);
        cesDeferredGroupPromises[focusTab]=ensureView.then(function(){
          var chain=Promise.resolve();items.forEach(function(item){chain=chain.then(function(){return cesExecuteDeferredScript(item);});});return chain;
        }).then(function(){
          try{window.dispatchEvent(new CustomEvent('ces:deferred-ready',{detail:{tab:focusTab,report:CESBoot.getReport()}}));}catch(ignore){}
          setTimeout(function(){cesLoadDeferredSharedTailLater_();},0);
          return true;
        }).catch(function(error){delete cesDeferredGroupPromises[focusTab];throw error;});
        return cesDeferredGroupPromises[focusTab];
      };

      CESBoot.loadHtml(window.CES_BOOT_MANIFEST.coreHtml.map(cesPrepareBootItem))
        .then(function(){return CESBoot.loadScripts(window.CES_BOOT_MANIFEST.coreScripts.map(cesPrepareBootItem));})
        .then(function(){
          if(window.CES_BOOT_WATCHDOG)clearTimeout(window.CES_BOOT_WATCHDOG);CES_hideSplash();
          try{window.dispatchEvent(new CustomEvent('ces:app-ready',{detail:CESBoot.getReport()}));}catch(ignore){}
          // Warm static page markup immediately after the shell is ready. HTML has
          // no business API side effects, so tab switches can reveal the real page
          // instantly while only the selected tab's JS executes on demand.
          setTimeout(function(){if(window.CES_preloadDeferredViews)window.CES_preloadDeferredViews().catch(function(error){console.warn('[CES deferred HTML]',error);});},180);
          if(!window.CES_TAB_INTENT_PREFETCH_BOUND){
            window.CES_TAB_INTENT_PREFETCH_BOUND=true;
            var prepareIntent=function(event){var node=event.target&&event.target.closest?event.target.closest('[data-ces-tab]'):null;if(node&&window.CES_prepareDeferredTab)window.CES_prepareDeferredTab(node.getAttribute('data-ces-tab'));};
            document.addEventListener('pointerover',prepareIntent,true);
            document.addEventListener('focusin',prepareIntent,true);
            document.addEventListener('pointerdown',prepareIntent,true);
          }
        })
        .catch(function(err){
          if(window.CES_BOOT_WATCHDOG)clearTimeout(window.CES_BOOT_WATCHDOG);console.error('[CES Hub boot failed]',err);CES_hideSplash();
          var box=document.getElementById('ces-boot-error');if(box){box.classList.remove('hidden');box.textContent='CES Hub boot error: '+(err&&err.message?err.message:err);}
        });



    </script>
