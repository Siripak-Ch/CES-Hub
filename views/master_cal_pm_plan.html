<div class="hidden animate-fade-in space-y-5 pb-20" id="view-master_cal_pm_plan">
  <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
    <div class="flex items-center gap-4"><div class="p-3 bg-blue-50 rounded-xl text-[#003DA5]"><i class="fas fa-screwdriver-wrench text-2xl"></i></div><div><h2 class="text-xl font-black text-slate-800">Master CAL/PM Plan</h2><p class="text-xs text-slate-400 font-bold">Standard master calibration and preventive-maintenance plan</p></div></div>
    <div class="flex flex-wrap items-center gap-2">
      <label class="ces-header-action-btn ces-action-upload cursor-pointer" title="Import Plan cal.xlsx"><i class="fas fa-file-arrow-up"></i><input id="mcp-import-file" class="hidden" type="file" accept=".xlsx,.xls,.csv" onchange="mcpImportFile(this.files[0])"></label>
      <button class="ces-standard-icon-btn" onclick="mcpAddRow()" title="Add row"><i class="fas fa-plus"></i></button>
      <button class="ces-standard-icon-btn ces-action-save" onclick="mcpSave()" title="Save"><i class="fas fa-floppy-disk"></i></button>
      <button class="ces-standard-icon-btn ces-action-excel" onclick="mcpExportExcel()" title="Export Excel"><i class="fas fa-file-excel"></i></button>
      <button class="ces-standard-icon-btn ces-action-pdf" onclick="mcpExportPdf()" title="Export PDF"><i class="fas fa-file-pdf"></i></button>
    </div>
  </div>
  <div class="bg-white p-4 rounded-2xl border border-slate-100 grid grid-cols-1 md:grid-cols-4 gap-3">
    <div class="sp-search md:col-span-2"><i class="fas fa-search"></i><input id="mcp-search" oninput="mcpRender()" placeholder="Search code / team / model / serial"></div>
    <select id="mcp-team" onchange="mcpRender()"><option value="ALL">All Teams</option></select>
    <select id="mcp-year" onchange="mcpRender()"><option value="ALL">All FY</option></select>
  </div>
  <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-4 min-w-0">
    <div class="flex justify-between items-center mb-3"><h3 class="font-black text-slate-800"><i class="fas fa-table text-[#003DA5] mr-2"></i>CAL/PM Plan Data</h3><span id="mcp-count" class="sp-pill">0 rows</span></div>
    <div class="overflow-x-auto border border-slate-100 rounded-2xl max-h-[650px]" id="mcp-table-wrap"><table class="min-w-[2700px] w-full text-[10px] text-left"><thead id="mcp-head" class="sticky top-0 z-10 bg-slate-50"></thead><tbody id="mcp-body"></tbody></table></div>
  </div>
</div>
