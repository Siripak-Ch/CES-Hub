<div class="hidden animate-fade-in space-y-5 pb-20" id="view-master_cal_pm_plan">
  <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
    <div class="flex items-center gap-4"><div class="p-3 bg-blue-50 rounded-xl text-[#003DA5]"><i class="fas fa-screwdriver-wrench text-2xl"></i></div><div><h2 class="text-xl font-black text-slate-800">Master CAL/PM Plan</h2><p class="text-xs text-slate-400 font-bold">Standard master calibration and preventive-maintenance plan</p></div></div>
    <div class="flex flex-wrap items-center gap-2">
      <a id="mcp-source-link" class="ces-standard-icon-btn ces-external-link-btn" href="https://docs.google.com/spreadsheets/d/1nbNmtlNHffCh-hvlV9RMxmUgZJYun7VNPbqi0k7PJEc/edit" target="_blank" rel="noopener" title="Open Master CAL/PM source sheet" aria-label="Open Master CAL/PM source sheet"><i class="fas fa-arrow-up-right-from-square"></i></a>
      <label class="ces-header-action-btn ces-action-upload cursor-pointer" title="Import Plan cal.xlsx"><i class="fas fa-file-arrow-up"></i><input id="mcp-import-file" class="hidden" type="file" accept=".xlsx,.xls,.csv" onchange="mcpImportFile(this.files[0])"></label>
      <button class="ces-standard-icon-btn" onclick="mcpAddRow()" title="Add row"><i class="fas fa-plus"></i></button>
      <button class="ces-standard-icon-btn ces-action-save" onclick="mcpSave()" title="Save"><i class="fas fa-floppy-disk"></i></button>
      <button class="ces-standard-icon-btn ces-action-excel" onclick="mcpExportExcel()" title="Export Excel"><i class="fas fa-file-excel"></i></button>
      <button class="ces-standard-icon-btn ces-action-pdf" onclick="mcpExportPdf()" title="Export PDF"><i class="fas fa-file-pdf"></i></button>
    </div>
  </div>
  <div class="bg-white p-3 rounded-2xl border border-slate-100"><div class="mcp-team-tabs" role="tablist" aria-label="Master CAL PM Source Sheet"><button type="button" class="mcp-team-tab ehs active" data-team="EHS" onclick="mcpSelectTeam('EHS')">EHS</button><button type="button" class="mcp-team-tab env" data-team="ENV" onclick="mcpSelectTeam('ENV')">ENV</button><button type="button" class="mcp-team-tab med" data-team="MED" onclick="mcpSelectTeam('MED')">MED</button><button type="button" class="mcp-team-tab lab" data-team="LAB" onclick="mcpSelectTeam('LAB')">LAB</button></div></div>
  <div class="bg-white rounded-3xl border border-slate-100 shadow-sm p-4 min-w-0">

    <div class="overflow-auto border border-slate-100 rounded-2xl min-h-[560px] max-h-[76vh]" id="mcp-table-wrap"><table class="mcp-table min-w-[2600px] w-full text-[10px] text-left"><thead id="mcp-head" class="sticky top-0 z-10 bg-slate-50"></thead><tbody id="mcp-body"></tbody></table></div>
    <div class="flex items-center justify-end gap-2 pt-3">
      <button id="mcp-prev" class="ces-standard-icon-btn" onclick="mcpPrevPage()" title="Previous page" aria-label="Previous page"><i class="fas fa-chevron-left"></i></button>
      <span id="mcp-page-info" class="sp-pill min-w-[92px] text-center">Page 1 / 1</span>
      <button id="mcp-next" class="ces-standard-icon-btn" onclick="mcpNextPage()" title="Next page" aria-label="Next page"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <style>
    #view-master_cal_pm_plan .mcp-table th{padding:9px 8px;border-bottom:1px solid #e2e8f0;color:#475569;white-space:nowrap;font-weight:900}
    #view-master_cal_pm_plan .mcp-table td{padding:4px;border-bottom:1px solid #eef2f7;vertical-align:middle}
    #view-master_cal_pm_plan .mcp-cell{width:100%;min-width:92px;border:1px solid transparent;border-radius:8px;padding:6px 7px;background:transparent;color:#0f172a}
