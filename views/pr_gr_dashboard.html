<section id="view-pr_gr_dashboard" class="hidden" aria-labelledby="pr69-title">
  <div class="pr69-card ces69-flex"><div><h2 id="pr69-title" style="font-size:23px;color:#004aad;font-weight:900">PR &amp; GR Dashboard</h2><p style="font-size:12px;color:#64748b">2026 Purchase Requests, Purchase Orders, Goods Receipts and Invoice Status · secured Google Sheet</p></div>
  <label>Import mode <select id="pr69UploadMode" class="ces69-btn"><option value="append">Append & update (no duplicates)</option><option value="replace">Replace all 2026 (staged & backed up)</option></select></label><label class="ces69-btn primary">Upload PR/GR Excel (append, skip duplicates)<input type="file" accept=".xlsx,.xls" style="display:none" onchange="ces69UploadPrGr(this)"></label><button class="ces69-btn" onclick="ces69LoadPrGr(true)">Refresh</button></div>
  <div id="pr69Progress" style="font-size:12px;color:#64748b;padding:6px" aria-live="polite"></div>
  <div class="pr69-card ces69-flex"><label>Month <select id="pr69Month" onchange="ces69RenderPrGr()"><option value="all">All months</option></select></label><label>Cost Center <select id="pr69Center" onchange="ces69RenderPrGr()"><option value="all">All cost centers</option></select></label><label>PR status <select id="pr69Status" onchange="ces69RenderPrGr()"><option value="all">All statuses</option></select></label><button class="ces69-btn" onclick="['pr69Month','pr69Center','pr69Status'].forEach(id=>document.getElementById(id).value='all');ces69RenderPrGr()">Reset</button></div>
  <div id="pr69Kpis" class="pr69-card pr69-grid"><p>Loading PR/GR data...</p></div>
  <div class="pr69-card"><h3 style="font-weight:800;color:#003DA5">Monthly PR Amount</h3><div style="height:270px;margin-top:12px"><canvas id="pr69MonthlyChart"></canvas></div></div>
  <div class="pr69-card"><div class="ces69-flex"><h3 style="font-weight:800;color:#003DA5">PR &amp; GR register</h3><span id="pr69Count"></span></div><div style="overflow:auto;max-height:65vh;margin-top:12px" id="pr69Table" role="region" aria-label="PR and GR data"></div></div>
</section>
