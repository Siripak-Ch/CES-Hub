<section id="view-pr_gr_dashboard" class="hidden pr-dashboard" aria-labelledby="pr69-title">
  <header class="pr69-header pr69-card">
    <div class="pr69-header-main"><span class="pr69-header-icon"><i class="fas fa-file-invoice-dollar"></i></span><div><small>PURCHASING ANALYTICS</small><h2 id="pr69-title">PR &amp; GR Dashboard</h2><p>Purchase Requests · Purchase Orders · Goods Receipts · Invoice tracking · 2026</p></div></div>
    <div class="pr69-toolbar" aria-label="PR and GR actions">
      <a id="pr69SourceLink" class="pr69-btn" title="Open linked Google Sheet" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true"><i class="fas fa-link"></i><span>Sheet</span></a>
      <button type="button" class="pr69-btn primary" onclick="document.getElementById('pr69File').click()" title="Import Excel"><i class="fas fa-file-arrow-up"></i><span>Import</span></button>
      <input id="pr69File" type="file" accept=".xlsx,.xls" hidden onchange="ces69UploadPrGr(this)">
      <button type="button" class="pr69-btn" onclick="ces69LoadPrGr(true)" title="Refresh data"><i class="fas fa-rotate"></i><span>Refresh</span></button>
      <button type="button" class="pr69-btn" onclick="ces69ExportPrGrPdf()" title="Export PDF"><i class="fas fa-file-pdf"></i><span>PDF</span></button>
      <button type="button" class="pr69-btn" onclick="ces69ExportPrGrExcel()" title="Export filtered Excel"><i class="fas fa-file-excel"></i><span>Excel</span></button>
      <button type="button" class="pr69-btn" onclick="ces69ResetPrGr()" title="Reset filters"><i class="fas fa-filter-circle-xmark"></i><span>Reset</span></button>
    </div>
  </header>
  <div class="pr69-meta"><label for="pr69UploadMode">Import mode</label><select id="pr69UploadMode"><option value="append">Add new / Update existing (skip duplicates)</option><option value="replace">Replace 2026 data (with backup)</option></select><span id="pr69Progress" role="status" aria-live="polite">Select an Excel file to import.</span></div>
  <div class="pr69-filters pr69-card"><label>Month<select id="pr69Month" onchange="ces69RenderPrGr()"><option value="all">All months</option></select></label><label>Cost Center<select id="pr69Center" onchange="ces69RenderPrGr()"><option value="all">All cost centers</option></select></label><label>PR Status<select id="pr69Status" onchange="ces69RenderPrGr()"><option value="all">All statuses</option></select></label><label>Search<input id="pr69Search" placeholder="PR / PO / Item / Vendor" oninput="ces69RenderPrGr()"></label></div>
  <div id="pr69Kpis" class="pr69-kpis" aria-live="polite"><div class="pr69-skeleton">Loading PR &amp; GR data…</div></div>
  <div class="pr69-panels"><article class="pr69-card"><h3>Monthly PR Amount</h3><div class="pr69-chart"><canvas id="pr69MonthlyChart"></canvas></div></article><article class="pr69-card"><h3>PR Status Distribution</h3><div class="pr69-chart"><canvas id="pr69StatusChart"></canvas></div></article></div>
  <article class="pr69-card"><div class="pr69-table-heading"><div><h3>PR &amp; GR Register</h3><span id="pr69Count">0 records</span></div><span id="pr69Updated"></span></div><div id="pr69Table" class="pr69-table-wrap" role="region" aria-label="PR and GR records" tabindex="0"><p class="pr69-skeleton">Connecting to Google Sheets…</p></div><div class="pr69-paging"><button type="button" onclick="ces69PrPage(-1)">Previous</button><span id="pr69PageLabel">Page 1</span><button type="button" onclick="ces69PrPage(1)">Next</button></div></article>
</section>
