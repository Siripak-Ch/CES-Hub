<section class="hidden animate-fade-in space-y-5 pb-20" id="view-audit_log">
  <style>
    #view-audit_log{--audit-blue:#004aad}#view-audit_log .audit-card{background:#fff;border:1px solid #dbe5f0;border-radius:22px;box-shadow:0 8px 24px rgba(30,64,110,.06)}
    #view-audit_log .audit-team-tab{height:38px;border:1px solid #d7e2ee;border-radius:12px;background:#f3f7fb;color:#64748b;font-size:11px;font-weight:900;transition:.18s}#view-audit_log .audit-team-tab.primary{background:var(--audit-blue);border-color:var(--audit-blue);color:#fff;box-shadow:0 7px 15px rgba(0,74,173,.2)}
    #view-audit_log .audit-stat{display:flex;align-items:center;gap:12px;padding:15px;border:1px solid #dbe5f0;border-radius:18px;background:#fff;min-width:0}#view-audit_log .audit-stat-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}#view-audit_log .audit-stat b{display:block;font-size:25px;line-height:1;color:#0f172a;margin-top:4px}#view-audit_log .audit-stat small{font-size:9px;font-weight:900;letter-spacing:.05em;color:#7c8da5}
    #view-audit_log .audit-filter{height:40px;border:1px solid #d6e2ef;border-radius:11px;background:#f8fbff;padding:0 11px;color:#334155;font-size:11px;font-weight:700;outline:none;min-width:0}#view-audit_log .audit-filter:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}
    #view-audit_log .audit-group{border:1px solid #e2e8f0;background:#f8fafc;border-radius:14px;padding:11px}#view-audit_log .audit-group-title{font-size:9px;font-weight:950;text-transform:uppercase;letter-spacing:.08em;color:#64748b}#view-audit_log .audit-chip{display:inline-flex;align-items:center;gap:4px;margin:5px 4px 0 0;padding:5px 8px;border-radius:999px;background:#eaf2ff;color:#315879;font-size:9px;font-weight:800}
    #view-audit_log .audit-table-wrap{overflow:auto;max-height:620px;scrollbar-gutter:stable}#view-audit_log .audit-table{width:100%;min-width:1120px;border-collapse:separate;border-spacing:0;font-size:10px}#view-audit_log .audit-table th{position:sticky;top:0;z-index:2;background:#eaf1f8;color:#506985;padding:11px;text-align:left;text-transform:uppercase;font-size:8px;letter-spacing:.05em;border-bottom:1px solid #d7e2ee;white-space:nowrap}#view-audit_log .audit-table td{padding:10px 11px;border-bottom:1px solid #edf2f7;vertical-align:top;color:#334155;line-height:1.4}#view-audit_log .audit-table tr:hover td{background:#f8fbff}
    #view-audit_log .audit-status-select{border:0;border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900;outline:none}#view-audit_log .audit-status-select.status-not-started{background:#fee2e2;color:#b91c1c}#view-audit_log .audit-status-select.status-in-progress{background:#fef3c7;color:#b45309}#view-audit_log .audit-status-select.status-completed{background:#d1fae5;color:#047857}
    @media(max-width:850px){#view-audit_log .audit-header{align-items:flex-start;flex-direction:column}#view-audit_log .audit-header-actions{width:100%;justify-content:flex-end}}
  </style>
  <div class="audit-card audit-header p-5 flex items-center justify-between gap-4"><div class="flex items-center gap-4 min-w-0"><div class="w-12 h-12 rounded-2xl bg-blue-50 border border-blue-100 text-[#004aad] grid place-items-center shrink-0"><i class="fas fa-clipboard-check text-xl"></i></div><div class="min-w-0"><h2 class="text-xl font-black text-slate-800">Audit Log</h2><p class="text-xs text-slate-400 font-bold mt-1">Corrective action, finding and status tracking · MED · LAB · EHS</p></div></div><div class="audit-header-actions flex gap-2 shrink-0"><a id="audit-drive-link" class="ces-standard-icon-btn" target="_blank" rel="noopener" title="Open Audit Drive"><i class="fas fa-folder-open"></i></a><a id="audit-excel-link" class="ces-standard-icon-btn" target="_blank" rel="noopener" title="Open source Excel"><i class="fas fa-link"></i></a><button class="ces-standard-icon-btn !bg-emerald-600 !text-white" onclick="exportAuditLogExcel()" title="Export filtered list"><i class="fas fa-file-excel"></i></button><button class="ces-standard-icon-btn" onclick="initAuditLog(true)" title="Sync audit data"><i class="fas fa-rotate"></i></button></div></div>
  <div class="audit-card p-3"><div class="grid grid-cols-3 gap-2"><button class="audit-team-tab primary" data-team="MED" onclick="selectAuditLogTeam('MED')">MED</button><button class="audit-team-tab" data-team="LAB" onclick="selectAuditLogTeam('LAB')">LAB</button><button class="audit-team-tab" data-team="EHS" onclick="selectAuditLogTeam('EHS')">EHS</button></div></div>
  <div id="audit-summary" class="grid grid-cols-2 xl:grid-cols-5 gap-3"></div>
  <div class="grid xl:grid-cols-5 gap-4"><div class="audit-card p-5 xl:col-span-2"><div class="flex items-center justify-between"><div><b class="text-sm text-slate-700">Overall Progress</b><p class="text-[10px] text-slate-400 mt-1">Completion across current team findings</p></div><i class="fas fa-chart-line text-blue-200 text-xl"></i></div><div id="audit-progress" class="mt-4"></div></div><div class="audit-card p-5 xl:col-span-3"><div class="flex items-center justify-between"><div><b class="text-sm text-slate-700">Finding Analysis</b><p class="text-[10px] text-slate-400 mt-1">Grouped by type, priority, owner and root cause</p></div><i class="fas fa-chart-pie text-blue-200 text-xl"></i></div><div id="audit-analysis" class="mt-4 grid sm:grid-cols-2 gap-3 text-xs"></div></div></div>
  <div class="audit-card p-4"><div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-2"><div class="xl:col-span-2 relative"><i class="fas fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-xs"></i><input id="audit-filter-search" class="audit-filter w-full !pl-9" placeholder="Search finding, responsible, clause..." oninput="applyAuditLogFilters()"></div><select id="audit-filter-status" class="audit-filter" onchange="applyAuditLogFilters()"><option value="all">All Status</option><option>Not Started</option><option>In Progress</option><option>Completed</option></select><select id="audit-filter-priority" class="audit-filter" onchange="applyAuditLogFilters()"><option value="all">All Priority</option></select><select id="audit-filter-responsible" class="audit-filter" onchange="applyAuditLogFilters()"><option value="all">All Responsible</option></select></div></div>
  <div class="audit-card overflow-hidden"><div class="flex items-center justify-between gap-4 p-4 border-b border-slate-100"><div><b id="audit-log-title" class="text-[#004aad]">MED Audit Log</b><div id="audit-log-status" class="text-[10px] text-slate-400 mt-1">Loading…</div></div><span id="audit-filter-count" class="px-3 py-1.5 rounded-full bg-blue-50 text-[#004aad] text-[10px] font-black">0 records</span></div><div class="audit-table-wrap"><table class="audit-table"><thead id="audit-log-head"></thead><tbody id="audit-log-body"><tr><td class="p-8 text-center text-slate-400">Open Audit Log to load data.</td></tr></tbody></table></div></div>
</section>
