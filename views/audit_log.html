<section class="hidden animate-fade-in space-y-5 pb-20" id="view-audit_log">
  <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-5 rounded-3xl border border-slate-100 shadow-sm">
    <div class="flex items-center gap-4"><div class="p-3 bg-blue-50 rounded-xl text-[#003DA5]"><i class="fas fa-clipboard-list text-2xl"></i></div><div><h2 class="text-xl font-black text-slate-800">Audit Log</h2><p class="text-xs text-slate-400 font-bold">MED · LAB · EHS audit records</p></div></div>
    <div class="flex flex-wrap gap-2"><a id="audit-drive-link" class="ces-standard-icon-btn" target="_blank" rel="noopener" title="Open Drive"><i class="fas fa-folder-open"></i></a><a id="audit-excel-link" class="ces-standard-icon-btn" target="_blank" rel="noopener" title="Open source Excel"><i class="fas fa-link"></i></a><button class="ces-standard-icon-btn !bg-emerald-600 !text-white" onclick="exportAuditLogExcel()" title="Export Excel"><i class="fas fa-file-excel"></i></button><button class="ces-standard-icon-btn" onclick="initAuditLog(true)" title="Refresh"><i class="fas fa-rotate"></i></button></div>
  </div>
  <div class="bg-white p-3 rounded-2xl border border-slate-100"><div class="grid grid-cols-3 gap-2"><button class="audit-team-tab ces-training-btn primary" data-team="MED" onclick="selectAuditLogTeam('MED')">MED</button><button class="audit-team-tab ces-training-btn" data-team="LAB" onclick="selectAuditLogTeam('LAB')">LAB</button><button class="audit-team-tab ces-training-btn" data-team="EHS" onclick="selectAuditLogTeam('EHS')">EHS</button></div></div>
  <div id="audit-summary" class="grid grid-cols-2 lg:grid-cols-5 gap-3"></div>
  <div class="grid lg:grid-cols-2 gap-4"><div class="bg-white rounded-2xl border p-4"><b class="text-sm text-slate-700">Overall Progress</b><div id="audit-progress" class="mt-4"></div></div><div class="bg-white rounded-2xl border p-4"><b class="text-sm text-slate-700">Finding Analysis</b><div id="audit-analysis" class="mt-3 grid grid-cols-2 gap-3 text-xs"></div></div></div>
  <div class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden"><div class="flex items-center justify-between p-4 border-b"><div><b id="audit-log-title" class="text-[#003DA5]">MED Audit Log</b><div id="audit-log-status" class="text-xs text-slate-400 mt-1">Loading…</div></div></div><div class="overflow-auto max-h-[620px]"><table class="w-full min-w-[1100px] text-xs"><thead id="audit-log-head" class="sticky top-0 bg-[#24558a] text-white z-10"></thead><tbody id="audit-log-body"><tr><td class="p-8 text-center text-slate-400">Open Audit Log to load data.</td></tr></tbody></table></div></div>
</section>
